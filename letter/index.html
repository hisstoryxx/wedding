<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You</title>
  <link rel="icon" type="image/svg+xml" href="/textures/favi.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fdf6f0 0%, #f5e6d8 50%, #fce4ec 100%);
      font-family: 'Noto Serif KR', serif;
      overflow: hidden;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(210, 150, 120, 0.3);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Password overlay */
    .password-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(253, 246, 240, 0.97);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .password-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .password-icon {
      font-size: 48px;
      margin-bottom: 24px;
    }

    .password-greeting {
      font-size: 22px;
      font-weight: 600;
      color: #6b4c3b;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .password-title {
      font-size: 14px;
      font-weight: 300;
      color: #a0725a;
      margin-bottom: 32px;
      letter-spacing: 2px;
    }

    .password-input-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .password-input {
      width: 220px;
      padding: 12px 20px;
      border: 2px solid #d4a98a;
      border-radius: 30px;
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      text-align: center;
      background: transparent;
      color: #6b4c3b;
      outline: none;
      transition: border-color 0.3s;
      letter-spacing: 4px;
    }

    .password-input::placeholder {
      letter-spacing: 1px;
      color: #c4a48a;
    }

    .password-input:focus {
      border-color: #a0725a;
    }

    .password-btn {
      padding: 10px 40px;
      background: #d4a98a;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-family: 'Noto Serif KR', serif;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      letter-spacing: 2px;
    }

    .password-btn:hover {
      background: #c4956f;
    }

    .password-btn:active {
      transform: scale(0.96);
    }

    .password-error {
      color: #c0392b;
      font-size: 13px;
      height: 20px;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .password-error.show {
      opacity: 1;
    }

    /* Envelope */
    .envelope-scene {
      perspective: 1200px;
      z-index: 1;
    }

    .envelope {
      position: relative;
      width: 320px;
      height: 220px;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .envelope-body {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #e8c9a8, #ddb992);
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(139, 90, 55, 0.2);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(165deg, #d4a87a, #c99b6d);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      transform-origin: top center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 3;
    }

    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
    }

    .envelope-back-flap {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55%;
      background: linear-gradient(to top, #c99b6d, #d4a87a);
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      z-index: 1;
    }

    .envelope-left-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, #c99b6d, #d4a87a);
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      z-index: 1;
    }

    .envelope-right-flap {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(to left, #c99b6d, #d4a87a);
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
      z-index: 1;
    }

    .heart-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      font-size: 28px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
      transition: opacity 0.3s, transform 0.3s;
    }

    .envelope.open .heart-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
    }

    .envelope-hint {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: #a0725a;
      white-space: nowrap;
      animation: pulse 2s ease-in-out infinite;
    }

    .envelope.open .envelope-hint {
      display: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Letter */
    .letter {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: 200px;
      background: #fffef9;
      border-radius: 3px;
      z-index: 2;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .envelope.open .letter {
      transform: translateY(-260px);
    }

    .letter-inner {
      padding: 24px 20px;
      text-align: center;
      color: #5a3e2e;
      font-size: 11px;
      line-height: 2;
    }

    .letter-date {
      font-size: 11px;
      color: #b08968;
      margin-bottom: 12px;
    }

    /* Full letter modal */
    .letter-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .letter-modal.show {
      opacity: 1;
      visibility: visible;
    }

    .letter-full {
      width: 90%;
      max-width: 480px;
      max-height: 80vh;
      background: #fffef9;
      border-radius: 8px;
      padding: 40px 32px;
      overflow-y: auto;
      transform: translateY(40px) scale(0.95);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .letter-modal.show .letter-full {
      transform: translateY(0) scale(1);
    }

    .letter-full-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 20px;
      color: #b08968;
      cursor: pointer;
      transition: color 0.3s;
    }

    .letter-full-close:hover {
      color: #6b4c3b;
    }

    .letter-full-date {
      font-size: 13px;
      color: #b08968;
      margin-bottom: 20px;
      text-align: center;
    }

    .letter-full-title {
      font-size: 22px;
      font-weight: 600;
      color: #6b4c3b;
      text-align: center;
      margin-bottom: 32px;
    }

    .letter-full-body {
      font-size: 15px;
      color: #5a3e2e;
      line-height: 2.2;
      text-align: left;
      word-break: keep-all;
    }

    .letter-full-body p {
      margin-bottom: 16px;
    }

    .letter-full-sign {
      text-align: right;
      margin-top: 32px;
      font-size: 16px;
      color: #6b4c3b;
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .envelope {
        width: 280px;
        height: 190px;
      }

      .letter {
        height: 170px;
      }

      .envelope.open .letter {
        transform: translateY(-230px);
      }

      .letter-full {
        padding: 32px 24px;
      }

      .letter-full-title {
        font-size: 19px;
      }

      .letter-full-body {
        font-size: 14px;
      }

      .password-greeting {
        font-size: 18px;
      }

      .password-title {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <!-- Password overlay -->
  <div class="password-overlay" id="passwordOverlay">
    <div class="password-icon">&#128140;</div>
    <div class="password-greeting">사랑하는 은별이에게 편지가 도착했어요</div>
    <div class="password-title">비밀번호를 입력해주세요</div>
    <div class="password-input-wrapper">
      <input
        type="password"
        class="password-input"
        id="passwordInput"
        placeholder="****"
        maxlength="20"
        autofocus
      />
      <button class="password-btn" id="passwordBtn">열기</button>
      <div class="password-error" id="passwordError">비밀번호가 틀렸어요</div>
    </div>
  </div>

  <!-- Envelope -->
  <div class="envelope-scene">
    <div class="envelope" id="envelope">
      <div class="envelope-body"></div>
      <div class="envelope-left-flap"></div>
      <div class="envelope-right-flap"></div>
      <div class="envelope-back-flap"></div>

      <!-- Letter inside -->
      <div class="letter" id="letterPreview">
        <div class="letter-inner">
          <div class="letter-date">2026. 3. 23.</div>
          <p>사랑하는 은별에게</p>
          <p style="margin-top:8px; font-size:10px; color:#b08968;">편지를 눌러서 읽어보세요</p>
        </div>
      </div>

      <div class="envelope-flap"></div>
      <div class="heart-seal">&#128156;</div>
      <div class="envelope-hint">봉투를 눌러보세요</div>
    </div>
  </div>

  <!-- Full letter modal -->
  <div class="letter-modal" id="letterModal">
    <div class="letter-full">
      <button class="letter-full-close" id="letterClose">&times;</button>
      <div class="letter-full-date">2026. 3. 23.</div>
      <div class="letter-full-title">사랑하는 은별에게</div>
      <div class="letter-full-body">
        <p>
          여기에 편지 내용을 작성해주세요.
        </p>
        <p>
          여러 문단으로 나눠서 쓸 수 있어요.
        </p>
        <p>
          진심을 담아 작성해보세요.
        </p>
      </div>
      <div class="letter-full-sign">
        초로 올림
      </div>
    </div>
  </div>

  <script type="module">
    // --- Password ---
    var PASSWORD = import.meta.env.VITE_LETTER_PASSWORD || "";

    var overlay = document.getElementById("passwordOverlay");
    var pwInput = document.getElementById("passwordInput");
    var pwBtn = document.getElementById("passwordBtn");
    var pwError = document.getElementById("passwordError");

    function checkPassword() {
      if (pwInput.value === PASSWORD) {
        overlay.classList.add("hidden");
      } else {
        pwError.classList.add("show");
        pwInput.value = "";
        pwInput.focus();
        setTimeout(function () {
          pwError.classList.remove("show");
        }, 2000);
      }
    }

    pwBtn.addEventListener("click", checkPassword);
    pwInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") checkPassword();
    });

    // --- Envelope ---
    var envelope = document.getElementById("envelope");
    var letterPreview = document.getElementById("letterPreview");
    var letterModal = document.getElementById("letterModal");
    var letterClose = document.getElementById("letterClose");
    var isOpen = false;

    envelope.addEventListener("click", function (e) {
      if (!isOpen) {
        envelope.classList.add("open");
        isOpen = true;
      }
    });

    letterPreview.addEventListener("click", function (e) {
      if (isOpen) {
        e.stopPropagation();
        letterModal.classList.add("show");
      }
    });

    letterClose.addEventListener("click", function () {
      letterModal.classList.remove("show");
    });

    letterModal.addEventListener("click", function (e) {
      if (e.target === letterModal) {
        letterModal.classList.remove("show");
      }
    });

    // --- Particles ---
    var particlesEl = document.getElementById("particles");
    for (var i = 0; i < 20; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.style.left = Math.random() * 100 + "%";
      p.style.animationDuration = 6 + Math.random() * 8 + "s";
      p.style.animationDelay = Math.random() * 10 + "s";
      p.style.width = p.style.height = 3 + Math.random() * 5 + "px";
      particlesEl.appendChild(p);
    }
  </script>
</body>
</html>
